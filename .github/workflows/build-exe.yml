name: Build Windows EXE

# Собирает TGU-Navigator.exe на настоящем Windows-раннере GitHub Actions
# и прикладывает его к релизу. Запускается автоматически при создании тега
# v* (релиза), а также вручную через Actions -> "Build Windows EXE".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей и PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Сборка exe (onefile)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          echo "Собираем версию ${VERSION}"
          # Версия зашивается в exe через переменную окружения,
          # app.main читает её как TGU_APP_VERSION.
          export TGU_APP_VERSION="${VERSION}"
          pyinstaller tgu-navigator.spec --noconfirm

      - name: Быстрая проверка собранного exe
        shell: bash
        run: |
          # Запускаем сервер: /health должен ответить 200. Это ловит битые
          # hiddenimports и проблемы консоли ещё до выкладывания файла в релиз.
          # ВАЖНО: stdout/shim-логи пишем в ASCII — русские строки в Windows-
          # консоли (cp1251) могут уронить PyInstaller-шим до старта сервера.
          export PYTHONUTF8=1
          ./dist/TGU-Navigator.exe > launcher.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 90); do
            if curl -s http://127.0.0.1:8000/health | grep -q '"status"'; then
              OK=1
              break
            fi
            sleep 2
          done
          echo "--- launcher.log ---"
          cat launcher.log || true
          if [ "$OK" = "1" ]; then
            echo "EXE OK: /health ответил"
            kill //PID/$PID 2>/dev/null || taskkill //IM TGU-Navigator.exe //F 2>/dev/null || true
            exit 0
          fi
          taskkill //IM TGU-Navigator.exe //F 2>/dev/null || true
          echo "EXE FAILED: /health не ответил"
          exit 1

      - name: Загрузка артефакта exe
        uses: actions/upload-artifact@v4
        with:
          name: TGU-Navigator-win64
          path: dist/TGU-Navigator.exe

      - name: Прикрепить exe к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TGU-Navigator.exe
