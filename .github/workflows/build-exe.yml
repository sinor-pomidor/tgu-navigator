name: Build Windows EXE

# Собирает TGU-Navigator.exe на настоящем Windows-раннере GitHub Actions
# и прикладывает его к релизу. Запускается автоматически при создании тега
# v* (релиза), а также вручную через Actions -> "Build Windows EXE".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей и PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Сборка exe (onefile)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          echo "Собираем версию ${VERSION}"
          # Версия зашивается в exe через переменную окружения,
          # app.main читает её как TGU_APP_VERSION.
          export TGU_APP_VERSION="${VERSION}"
          pyinstaller tgu-navigator.spec --noconfirm

      - name: Быстрая проверка собранного exe
        shell: bash
        run: |
          # Запускаем сервер: /health должен ответить 200. Это ловит битые
          # hiddenimports и проблемы консоли ещё до выкладывания файла в релиз.
          # ВАЖНО: stdout/shim-логи пишем в ASCII — русские строки в Windows-
          # консоли (cp1251) могут уронить PyInstaller-шим до старта сервера.
          export PYTHONUTF8=1
          ./dist/TGU-Navigator.exe > launcher.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 90); do
            if curl -s http://127.0.0.1:8000/health | grep -q '"status"'; then
              OK=1
              break
            fi
            sleep 2
          done
          echo "--- launcher.log ---"
          cat launcher.log || true
          if [ "$OK" = "1" ]; then
            echo "EXE OK: /health ответил"
            kill //PID/$PID 2>/dev/null || taskkill //IM TGU-Navigator.exe //F 2>/dev/null || true
            exit 0
          fi
          taskkill //IM TGU-Navigator.exe //F 2>/dev/null || true
          echo "EXE FAILED: /health не ответил"
          exit 1

      - name: Загрузка артефакта exe
        uses: actions/upload-artifact@v4
        with:
          name: TGU-Navigator-win64
          path: dist/TGU-Navigator.exe

      - name: Прикрепить exe к релизу
        # Загружаем ассет напрямую через GitHub API (curl), а не через
        # softprops/action-gh-release: тот падал с 403 на GITHUB_TOKEN.
        # Файл берём из артефакта этого же запуска — он проверен smoke-тестом.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Релиз существует только если он был создан через GitHub (кнопку/
          # API). Обычный git push тега НЕ создаёт релиз — тогда создаём его
          # сами через API, иначе запрос к /releases/tags/ вернёт 404 и шаг
          # упадёт с JSONDecodeError.
          REL_JSON=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")
          if ! echo "${REL_JSON}" | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if 'id' in d else 1)"; then
            echo "release for tag ${TAG} not found -> creating"
            curl -sf -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":false,\"body\":\"Windows EXE is attached automatically by CI.\"}" \
              -o created.json
            REL_JSON=$(cat created.json)
          fi
          RID=$(echo "${REL_JSON}" | python -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "release id: ${RID}"
          # Если ассет с таким именем уже есть — удаляем, затем загружаем заново.
          EXISTING=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets" \
            | python -c "import json,sys; [print(a['id']) for a in json.load(sys.stdin) if a['name']=='TGU-Navigator.exe']" || true)
          for AID in ${EXISTING}; do
            curl -sf -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${AID}" -o /dev/null || true
            echo "удалён старый ассет ${AID}"
          done
          # ВАЖНО: раннер Windows — bash без /tmp, поэтому ответ API пишем
          # в файл внутри рабочей директории. print() с русским текстом может
          # упасть на cp1251 — выводим ASCII, данные читаем с encoding='utf-8'.
          curl -sf -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @dist/TGU-Navigator.exe \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RID}/assets?name=TGU-Navigator.exe" \
            -o asset.json
          python -c "import json; a=json.load(open('asset.json', encoding='utf-8')); print('uploaded:', a['name'], a['size'], a['state'])"
